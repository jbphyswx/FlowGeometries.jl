name = "FlowGeometries"
uuid = "0ccd6995-f618-4175-b01e-f437d0cb4974"
version = "0.1.0"
authors = ["Jordan Benjamin <jordantbenjamin@gmail.com>"]

[workspace]
projects = ["test", "benchmark", "docs"]

[deps]
ComputationalBackends = "5c6e2104-4040-447f-8fc0-66ec2223b019"
FlowTransformBindings = "73c6b5d6-1010-4337-8b9e-d550f02c124c"

[extras]
SpectralBackends = "289ded02-b044-41b2-8b2d-71f2a47755d1"

[sources]
ComputationalBackends = {url = "https://github.com/jbphyswx/ComputationalBackends.jl.git"}
FlowTransformBindings = {url = "https://github.com/jbphyswx/FlowTransformBindings.jl.git"} # TODO :: Remove the dependence on a transform package
SpectralBackends = {url = "https://github.com/jbphyswx/SpectralBackends.jl.git"}

[weakdeps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
DelaunayTriangulation = "927a84f5-c5f4-47a5-9785-b46e178433df"
Distributed = "8ba89e20-285c-5b6f-9357-94700520ee1b"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
MPI = "da04e1cc-30fd-572f-bb4f-1f8673147195"
NearestNeighbors = "b8a86587-4115-5ab1-83bc-aa920d37bbce"
PencilArrays = "0e08944d-e94e-41b1-9406-dcf66b6a9d2e"
Quickhull = "baca2653-9c88-49d2-a488-12dbf25fc4fb"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"

[extensions]
FlowGeometriesAdaptExt = "Adapt"
FlowGeometriesDelaunayTriangulationExt = "DelaunayTriangulation"
FlowGeometriesDistributedExt = "Distributed"
FlowGeometriesKernelAbstractionsExt = ["KernelAbstractions", "Adapt"]
FlowGeometriesMPIExt = "MPI"
FlowGeometriesNearestNeighborsExt = ["NearestNeighbors", "StaticArrays"]
FlowGeometriesPencilArraysExt = ["MPI", "PencilArrays"]
FlowGeometriesQuickhullExt = "Quickhull"
FlowGeometriesSparseArraysExt = "SparseArrays"
FlowGeometriesStaticArraysExt = "StaticArrays"

[compat]
Adapt = "4"
ComputationalBackends = "0.1"
DelaunayTriangulation = "1"
Distributed = "1.11"
FlowTransformBindings = "0.1"
KernelAbstractions = "0.9, 0.10"
MPI = "0.20"
NearestNeighbors = "0.4"
PencilArrays = "0.19"
Quickhull = "0.2"
SparseArrays = "1.11"
StaticArrays = "1"
julia = "1.11"
