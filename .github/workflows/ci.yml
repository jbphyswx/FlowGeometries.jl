name: ci
on:
  push:
    branches:
      - main
      - trying
      - staging
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        # Coverage is the CodeCov workflow's job. Collecting it here too compiles line counters into
        # the package, which de-optimizes it enough to allocate inside code the allocation gates
        # assert is allocation-free — measured, 64 B on a sweep that allocates nothing otherwise. The
        # tests that run are unchanged either way; only the instrumentation is dropped.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

  # The threaded backends must produce bit-identical results to serial, which a single-threaded
  # run cannot show. Same suite, more threads.
  test-threaded:
    name: ci threaded (4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          JULIA_NUM_THREADS: '4'

  docs-build:
    name: docs (examples are executed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Build docs and run every documented example
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl
        env:
          GKSwstype: nul
